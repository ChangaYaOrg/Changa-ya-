<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changa Ya - Trabajos y Servicios en Argentina</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans text-slate-800 min-h-screen flex flex-col">

<!-- NAVBAR -->
<header class="bg-sky-600 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center space-x-2 cursor-pointer" onclick="resetFilters()">
            <div class="w-9 h-9 bg-white rounded-xl flex items-center justify-center text-sky-600 font-bold shadow">
                <i class="fa-solid fa-briefcase"></i>
            </div>
            <div>
                <span class="text-xl font-black tracking-tight">CHANGA <span class="text-amber-400">YA!</span></span>
                <p class="text-[10px] text-sky-100">Trabajo independiente 🇦🇷</p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openModal('modalPublish')" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold px-3 py-2 rounded-xl text-xs shadow transition">
                <i class="fa-solid fa-circle-plus"></i> Publicar
            </button>
            <button onclick="openModal('modalAuth')" id="btnAuthText" class="bg-white/10 hover:bg-white/20 text-white border border-white/30 font-semibold px-3 py-2 rounded-xl text-xs transition">
                Ingresar
            </button>
        </div>
    </div>
</header>

<!-- HERO -->
<section class="bg-gradient-to-b from-sky-600 to-sky-700 text-white py-8 px-4 text-center">
    <div class="max-w-2xl mx-auto space-y-3">
        <h1 class="text-2xl sm:text-3xl font-extrabold">Encontrá laburo o contratá al toque</h1>
        <p class="text-xs sm:text-sm text-sky-100">Conectamos personas que necesitan resolver un trabajo rápido con trabajadores independientes de todo el país.</p>
    </div>
</section>

<!-- LISTA -->
<main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
    <h2 class="text-lg font-bold text-slate-900 mb-4">Changas Disponibles</h2>
    <div id="jobsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</main>

<!-- MODAL INGRESO -->
<div id="modalAuth" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-6 space-y-4">
        <div class="flex justify-between items-center">
            <h3 class="font-bold text-base">Ingresar / Registrarse</h3>
            <button onclick="closeModal('modalAuth')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <form onsubmit="handleAuth(event)" class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Correo Electrónico</label>
                <input type="email" id="inputEmail" required placeholder="tuemail@ejemplo.com" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">
                Continuar
            </button>
        </form>
    </div>
</div>

<!-- MODAL PUBLICAR -->
<div id="modalPublish" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
        <div class="flex justify-between items-center">
            <h3 class="font-bold text-base">Publicar una Changa</h3>
            <button onclick="closeModal('modalPublish')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <form onsubmit="handlePublish(event)" class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Título del Trabajo</label>
                <input type="text" id="pubTitle" required placeholder="Ej. Reparar canilla" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Monto ($ARS)</label>
                <input type="number" id="pubBudget" required placeholder="25000" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full bg-amber-400 hover:bg-amber-500 text-slate-900 font-bold py-2.5 rounded-xl text-xs transition shadow">
                Publicar Ahora
            </button>
        </form>
    </div>
</div>

<script>
    let changas = JSON.parse(localStorage.getItem('changa_list')) || [
        { id: 1, title: "Armado de placard", budget: 40000, date: "Ejemplo" },
        { id: 2, title: "Corte de pasto", budget: 25000, date: "Ejemplo" }
    ];

    window.addEventListener('DOMContentLoaded', () => { renderJobs(); });

    function openModal(id) {
        document.getElementById(id).classList.remove('hidden');
    }

    function closeModal(id) {
        document.getElementById(id).classList.add('hidden');
    }

    function handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('inputEmail').value;
        localStorage.setItem('changa_user', email);
        document.getElementById('btnAuthText').innerText = email.split('@')[0];
        closeModal('modalAuth');
        alert("¡Sesión iniciada con éxito!");
    }

    function handlePublish(e) {
        e.preventDefault();
        const newJob = {
            id: Date.now(),
            title: document.getElementById('pubTitle').value,
            budget: parseFloat(document.getElementById('pubBudget').value),
            date: "Recién publicado"
        };
        changas.unshift(newJob);
        localStorage.setItem('changa_list', JSON.stringify(changas));
        renderJobs();
        closeModal('modalPublish');
        alert("¡Changa publicada correctamente!");
    }

    function renderJobs() {
        const grid = document.getElementById('jobsGrid');
        grid.innerHTML = '';
        changas.forEach(job => {
            const card = document.createElement('div');
            card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center";
            card.innerHTML = `<div><h4 class="font-bold text-sm">${job.title}</h4><span class="text-xs text-slate-500">$${job.budget}</span></div><span class="text-[10px] bg-sky-50 text-sky-600 px-2 py-1 rounded-lg font-semibold">${job.date}</span>`;
            grid.appendChild(card);
        });
    }

    function resetFilters() { renderJobs(); }
</script>
</body>
</html>
