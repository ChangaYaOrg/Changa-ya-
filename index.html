
<!-- CONEXIÓN CON SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
    const SUPABASE_URL = 'https://yyfldvialbkozrclylxg.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_5mpiP-ptii-HE_7OOY9AJQ_dQjSDDDZ';

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    let currentUser = JSON.parse(localStorage.getItem('changa_user')) || null;
    let changas = [];
    let realtimeChannel = null;

    window.addEventListener('DOMContentLoaded', async () => {
        updateAuthUI();
        await fetchChangas();
        subscribeToChangas();
    });

    function escapeHTML(value) {
        return String(value ?? '').replace(/[&<>"']/g, char => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        })[char]);
    }

    async function fetchChangas() {
        const loading = document.getElementById('loadingIndicator');

        try {
            const { data, error } = await supabaseClient
                .from('changas')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            changas = data.map(item => ({
                id: item.id,
                title: item.title,
                category: item.category,
                province: item.province,
                city: item.city,
                budget: Number(item.budget),
                description: item.description,
                clientName: item.client_name,
                clientPhone: item.client_phone,
                date: item.created_at
            }));

            loading.classList.add('hidden');
            applyFilters();

        } catch (error) {
            console.error('Error cargando changas:', error);
            loading.innerHTML =
                '<p class="text-rose-500">No se pudieron cargar las publicaciones. Revisá la conexión.</p>';
        }
    }

    function subscribeToChangas() {
        realtimeChannel = supabaseClient
            .channel('changas-en-tiempo-real')
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'changas'
                },
                () => fetchChangas()
            )
            .subscribe(status => {
                console.log('Estado de sincronización:', status);
            });
    }

    function updateAuthUI() {
        const txtAuth = document.getElementById('txtUserAuth');

        if (currentUser) {
            txtAuth.innerText = currentUser.email.split('@')[0];
        }
    }

    function handleAuthClick() {
        if (!currentUser) openModal('modalAuth');
    }

    function handleAuthSubmit(e) {
        e.preventDefault();

        currentUser = {
            email: document.getElementById('authEmail').value
        };

        localStorage.setItem('changa_user', JSON.stringify(currentUser));
        updateAuthUI();
        closeModal('modalAuth');

        alert('¡Sesión iniciada!');
    }

    function renderChangas(list) {
        const grid = document.getElementById('jobsGrid');
        const emptyState = document.getElementById('emptyState');
        const badgeCount = document.getElementById('badgeCount');

        badgeCount.innerText = list.length;
        grid.innerHTML = '';

        if (list.length === 0) {
            emptyState.classList.remove('hidden');
            grid.classList.add('hidden');
            return;
        }

        emptyState.classList.add('hidden');
        grid.classList.remove('hidden');

        list.forEach(item => {
            const card = document.createElement('div');

            card.className =
                'bg-white rounded-2xl p-5 shadow-sm hover:shadow-md transition border border-slate-200 flex flex-col justify-between animate-fade-in';

            const formattedBudget = new Intl.NumberFormat('es-AR', {
                style: 'currency',
                currency: 'ARS',
                maximumFractionDigits: 0
            }).format(item.budget || 0);

            card.innerHTML = `
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="bg-celeste-50 text-celeste-700 text-[11px] font-bold px-2.5 py-1 rounded-lg border border-celeste-100">
                            ${escapeHTML(item.category)}
                        </span>
                        <span class="text-[11px] text-slate-400">Reciente</span>
                    </div>

                    <h3 class="font-extrabold text-slate-900 text-base mb-2">
                        ${escapeHTML(item.title)}
                    </h3>

                    <div class="flex items-center space-x-1.5 text-xs text-slate-600 font-medium mb-3">
                        <i class="fa-solid fa-location-dot text-rose-500"></i>
                        <span>${escapeHTML(item.city)}, <strong>${escapeHTML(item.province)}</strong></span>
                    </div>

                    <p class="text-xs text-slate-600 mb-4 bg-slate-50 p-2.5 rounded-xl">
                        "${escapeHTML(item.description)}"
                    </p>
                </div>

                <div class="pt-3 border-t border-slate-100 flex items-center justify-between mt-auto">
                    <div>
                        <span class="text-[10px] uppercase font-bold text-slate-400 block">Presupuesto</span>
                        <span class="text-lg font-black text-slate-900">${formattedBudget}</span>
                    </div>

                    <button onclick="postulateToChanga('${item.id}')"
                        class="bg-celeste-600 text-white text-xs font-bold px-3 py-2 rounded-xl shadow">
                        Ver Contacto
                    </button>
                </div>
            `;

            grid.appendChild(card);
        });
    }

    function applyFilters() {
        const keyword = document.getElementById('searchKeyword').value.toLowerCase().trim();
        const province = document.getElementById('filterProvince').value;
        const category = document.getElementById('filterCategory').value;

        const filtered = changas.filter(item => {
            const matchesKeyword =
                (item.title || '').toLowerCase().includes(keyword) ||
                (item.description || '').toLowerCase().includes(keyword) ||
                (item.city || '').toLowerCase().includes(keyword);

            const matchesProvince =
                province === 'TODAS' || item.province === province;

            const matchesCategory =
                category === 'TODAS' || item.category === category;

            return matchesKeyword && matchesProvince && matchesCategory;
        });

        renderChangas(filtered);
    }

    function resetFilters() {
        document.getElementById('searchKeyword').value = '';
        document.getElementById('filterProvince').value = 'TODAS';
        document.getElementById('filterCategory').value = 'TODAS';

        renderChangas(changas);
    }

    function postulateToChanga(changaId) {
        const changa = changas.find(c => String(c.id) === String(changaId));
        if (!changa) return;

        const formattedBudget = new Intl.NumberFormat('es-AR', {
            style: 'currency',
            currency: 'ARS',
            maximumFractionDigits: 0
        }).format(changa.budget || 0);

        const phone = (changa.clientPhone || '').replace(/[^0-9]/g, '');

        document.getElementById('contactModalContent').innerHTML = `
            <div class="bg-slate-50 p-3 rounded-xl border">
                <h4 class="font-bold text-slate-900 text-sm">${escapeHTML(changa.title)}</h4>
                <p class="text-xs text-slate-600">Presupuesto: ${formattedBudget}</p>
            </div>

            <div class="bg-emerald-50 p-3 rounded-xl border border-emerald-100">
                <div class="font-bold text-slate-800 text-sm">${escapeHTML(changa.clientName)}</div>
                <div class="text-xs text-slate-500">Teléfono: ${escapeHTML(changa.clientPhone)}</div>
            </div>

            <a href="https://wa.me/${phone}?text=${encodeURIComponent(
                'Hola ' + changa.clientName + ', me interesa tu changa: ' + changa.title
            )}" target="_blank" rel="noopener noreferrer"
                class="w-full bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm text-center block shadow">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                Contactar por WhatsApp
            </a>
        `;

        openModal('modalContact');
    }

    async function handlePublishSubmit(e) {
        e.preventDefault();

        const button = e.submitter;
        button.disabled = true;
        button.innerText = 'Publicando...';

        const newChanga = {
            title: document.getElementById('pubTitle').value.trim(),
            category: document.getElementById('pubCategory').value,
            province: document.getElementById('pubProvince').value,
            city: document.getElementById('pubCity').value.trim(),
            budget: Number(document.getElementById('pubBudget').value),
            description: document.getElementById('pubDescription').value.trim(),
            client_name: document.getElementById('pubName').value.trim(),
            client_phone: document.getElementById('pubPhone').value.trim()
        };

        try {
            const { error } = await supabaseClient
                .from('changas')
                .insert([newChanga]);

            if (error) throw error;

            document.querySelector('#modalPublish form').reset();
            closeModal('modalPublish');

            alert('¡Changa publicada correctamente!');

            await fetchChangas();

        } catch (error) {
            console.error('Error publicando:', error);
            alert('No se pudo publicar. Revisá los datos y los permisos.');
        } finally {
            button.disabled = false;
            button.innerText = 'Publicar en la Nube';
        }
    }

    function openModal(modalId) {
        document.getElementById(modalId).classList.remove('hidden');
    }

    function closeModal(modalId) {
        document.getElementById(modalId).classList.add('hidden');
    }
</script>
</body>
</html>
